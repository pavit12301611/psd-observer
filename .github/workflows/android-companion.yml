name: Android companion
on:
  push:
    branches: [main, arena/ffde9465-psd-observer]
    paths: ['app/companion/**', 'whatsapp-agent/**', '.github/workflows/android-companion.yml', '!app/companion/docs/**', '!app/companion/README.md']
  pull_request:
    paths: ['app/companion/**', 'whatsapp-agent/**', '.github/workflows/android-companion.yml', '!app/companion/docs/**', '!app/companion/README.md']
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build with the owner-controlled stable signing key (requires private repository secrets)
        type: boolean
        default: false
      publish_beta:
        description: Publish signed APK as a permanent public prerelease after all validation passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-companion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    defaults:
      run:
        working-directory: whatsapp-agent
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: whatsapp-agent/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check && node scripts/ci-report.mjs npm test && npm run verify:bundle
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/companion
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/companion/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm ci --no-audit --no-fund
        working-directory: whatsapp-agent
      - run: node scripts/ci-report.mjs npx playwright test
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-web-evidence
          path: |
            app/companion/playwright-report/
            app/companion/test-results/
          retention-days: 14
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/companion
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/companion/package-lock.json
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Install pinned SDK platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::Hosted Android SDK command-line tools are missing at $SDK"
            exit 1
          fi
          node scripts/ci-run.mjs "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci --no-audit --no-fund && npm run build && npm run android:sync
      - run: chmod +x android/gradlew && cd android && node ../scripts/ci-run.mjs ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleLocal
      - name: Collect installable APKs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/observer-${VERSION}-preview.apk"
          cp android/app/build/outputs/apk/local/app-local.apk "artifacts/observer-${VERSION}-local.apk"
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS)
          printf '%s\n' \
            'PREVIEW: debug-signed, .preview package. Cannot replace an already installed Preview built by another runner.' \
            'LOCAL: debug-signed .stable package that installs ALONGSIDE Preview. It includes the PC-signed web update channel: pair it once, then interface updates arrive from your PC without reinstalling. Not a public production artifact.' \
            'Neither artifact is a signed production release; that still needs the owner-controlled release key.' > artifacts/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: observer-android-apks
          path: app/companion/artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-android-lint-unit
          path: |
            app/companion/android/app/build/reports/
            app/companion/android/app/build/test-results/
          retention-days: 14
  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
        working-directory: app/companion
      - uses: actions/download-artifact@v4
        with:
          name: observer-android-apks
          path: app/companion/artifacts/
      - run: node --test scripts/android-startup.test.mjs scripts/android-credential.test.mjs scripts/android-quick-action.test.mjs
        working-directory: app/companion
      - name: Resolve preview APK path
        run: echo "OBSERVER_PREVIEW_APK=$PWD/app/companion/artifacts/observer-$(node -p "require('./app/companion/package.json').version")-preview.apk" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install "$OBSERVER_PREVIEW_APK"
            adb shell am start -W -n in.observer.companion.preview/in.observer.companion.MainActivity
            cd app/companion && node scripts/ci-run.mjs node e2e/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-android-emulator
          path: app/companion/android-smoke-results/
          retention-days: 14

  # A signed web bundle is the only update a phone gets without an APK, so it
  # is packed and verified here on every push: the packer must produce a
  # manifest the phone's own rules accept, or the release is broken before it
  # ever reaches a device.
  ota:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-agent
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: whatsapp-agent/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build the web bundle this pack would ship
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: app/companion
      - name: Resolve the bundle version
        run: echo "OTA_VERSION=$(node -p "require('../app/companion/package.json').version")" >> "$GITHUB_ENV"
      - name: Pack a signed OTA bundle from that build
        run: |
          set -euo pipefail
          node scripts/app-update.mjs pack --version "$OTA_VERSION" --notes "CI pack check" > pack.json
          node scripts/verify-ota-pack.mjs pack.json "$OTA_VERSION"
      - name: A phone can see it, and the manifest it reads is signed
        run: node scripts/app-update.mjs status > status.json && node scripts/verify-ota-pack.mjs --status status.json "$OTA_VERSION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-ota-pack
          path: whatsapp-agent/data/mobile/updates/
          retention-days: 7

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    needs: [agent, web, apk, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/companion
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Prepare owner signing material privately
        env:
          KEYSTORE_B64: ${{ secrets.OBSERVER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OBSERVER_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.OBSERVER_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OBSERVER_ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Owner signing secrets are not configured. No debug key/unsigned APK will be published as a signed release."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/observer-release.p12"
      - run: npm ci --no-audit --no-fund && npm run build && npm run android:sync
      - name: Build and verify owner-signed APK
        env:
          OBSERVER_KEYSTORE: ${{ runner.temp }}/observer-release.p12
          OBSERVER_STORE_PASSWORD: ${{ secrets.OBSERVER_ANDROID_STORE_PASSWORD }}
          OBSERVER_KEY_PASSWORD: ${{ secrets.OBSERVER_ANDROID_KEY_PASSWORD }}
          OBSERVER_KEY_ALIAS: ${{ secrets.OBSERVER_ANDROID_KEY_ALIAS }}
        run: |
          cd android
          node ../scripts/ci-run.mjs ./gradlew --no-daemon lintRelease assembleRelease
          cd ..
          mkdir -p signed-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk signed-artifacts/observer-1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed-artifacts/observer-1.1.0.apk > signed-artifacts/signer.txt
          node scripts/verify-signer.mjs signed-artifacts/signer.txt
          (cd signed-artifacts && sha256sum observer-1.1.0.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: observer-owner-signed-android
          path: app/companion/signed-artifacts/
          retention-days: 14
      - name: Remove temporary private key
        if: always()
        run: rm -f "$RUNNER_TEMP/observer-release.p12"
  publish-beta:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && inputs.signed_release
    needs: signed-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: observer-owner-signed-android
          path: signed-artifacts
      - name: Publish permanent beta, never silently replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release create android-v1.1.0 --repo "$REPOSITORY" --target "$SOURCE_SHA" --prerelease --title 'Observer Android 1.1.0 Beta' --notes 'Owner-signed beta. Requires PC agent 3.10.0+. See source/docs for test scope, hardware/OS-push setup and limitations. No automatic action retries, silent permission changes or Play Store publication.' signed-artifacts/observer-1.1.0.apk signed-artifacts/SHA256SUMS signed-artifacts/signer.txt
